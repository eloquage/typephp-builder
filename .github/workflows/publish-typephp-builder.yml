# Build and publish ghcr.io/eloquage/typephp-builder.
# Keep TYPEPHP_REF in sync with ARG TYPEPHP_REF in Dockerfile.

name: Publish TypePHP builder

on:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/publish-typephp-builder.yml'
  workflow_dispatch:

concurrency:
  group: publish-typephp-builder-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: eloquage/typephp-builder
  TYPEPHP_REF: 30b6f43bb705b06d3dba387d10aeb140c61fce7d

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short TYPEPHP_REF
        id: ref
        run: echo "short=${TYPEPHP_REF:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            TYPEPHP_REF=${{ env.TYPEPHP_REF }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ref.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            /orgs/eloquage/packages/container/typephp-builder/visibility \
            -f visibility=public

      - name: Smoke tpc and PHPX
        run: |
          docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker run --rm "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" tpc.php --help
          docker run --rm "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            test -f /opt/typephp/vendor/swoole/phpx/lib/libphpx.so
